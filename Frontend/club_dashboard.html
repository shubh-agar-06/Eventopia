<!doctype html>
<html>
  <head>
    <title>Club Dashboard</title>
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="club_dashboard.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <h2>Club Dashboard</h2>

    <div class="card">
      <h3>Create Event</h3>

      <form id="eventForm">
        <input type="text" id="eventName" placeholder="Event Name *" required />

        <textarea id="description" placeholder="Event Description"></textarea>

        <label for="posterFile">Poster image (PNG, JPEG, JPG, max 1MB)</label>
        <input
          type="file"
          id="posterFile"
          accept=".png,.jpg,.jpeg,image/png,image/jpeg"
        />

        <input
          type="date"
          id="eventDate"
          required
          title="Date must be today or later"
        />
        <input
          type="time"
          id="eventTime"
          required
          title="Time must be in the future if date is today"
        />

        <input type="text" id="venue" placeholder="Venue *" required />

        <input
          type="text"
          id="teamSize"
          placeholder="Members per Team * (e.g. 3 or 3-5)"
          required
        />

        <input
          type="number"
          id="maxTeams"
          placeholder="Max Teams Allowed"
          min="1"
        />

        <label for="eventCategory">Type of event</label>
        <select id="eventCategory">
          <option value="Others" selected>Others</option>
          <option value="Cultural">Cultural</option>
          <option value="Technical">Technical</option>
        </select>

        <input
          type="number"
          id="registrationFee"
          placeholder="Registration Fee"
        />

        <input type="number" id="winningAmount" placeholder="Winning Amount" />

        <input
          type="text"
          id="studentCoordinatorName"
          placeholder="Student Coordinator Name"
        />

        <input
          type="text"
          id="studentCoordinatorContact"
          placeholder="Student Coordinator Contact"
          maxlength="10"
          pattern="[0-9]*"
          inputmode="numeric"
        />

        <input
          type="text"
          id="facultyCoordinatorName"
          placeholder="Faculty Coordinator Name"
        />

        <button type="submit">Create Event</button>
      </form>

      <p id="msg"></p>
    </div>

    <hr />

    <h3>Active Events</h3>

    <table id="eventTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Date</th>
          <th>Time</th>
          <th>Venue</th>
          <th>Category</th>
          <th>Fee</th>
          <th>Prize</th>
          <th>Registrations</th>
          <th>Edit</th>
          <th>Completed</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h3>Past Events</h3>

    <table id="pastEventTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Date</th>
          <th>Time</th>
          <th>Venue</th>
          <th>Note</th>
          <th>Edit Note</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <!-- View Students modal (teamwise) -->
    <div id="viewStudentsModal" class="modal">
      <div class="modal-content modal-content--table">
        <span class="modal-close" id="viewStudentsModalClose">&times;</span>
        <h3 class="modal-title">Registered Students (by team)</h3>
        <input
          type="text"
          id="viewStudentsSearch"
          class="modal-search"
          placeholder="Search by Reg No or team name..."
        />
        <div id="viewStudentsTeamwise"></div>
        <p id="viewStudentsEmpty" class="modal-empty">No registrations yet.</p>
      </div>
    </div>

    <!-- Edit Event modal (all fields editable except Members per team) -->
    <div id="editEventModal" class="modal">
      <div class="modal-content modal-content--form">
        <span class="modal-close" id="editEventModalClose">&times;</span>
        <h3 class="modal-title">Edit Event</h3>
        <form id="editEventForm">
          <input type="hidden" id="editEventId" />
          <label>Event Name *</label>
          <input type="text" id="editEventName" required />
          <label>Event Description</label>
          <textarea id="editDescription" rows="3"></textarea>
          <label>Event Date *</label>
          <input type="date" id="editEventDate" required />
          <label>Event Time *</label>
          <input type="time" id="editEventTime" required />
          <label>Venue *</label>
          <input type="text" id="editVenue" required />
          <label>Members per team (not editable)</label>
          <input
            type="text"
            id="editTeamSize"
            readonly
            disabled
            class="input-readonly"
          />
          <label>Max Teams Allowed</label>
          <input type="number" id="editMaxTeams" min="0" />
          <label>Type of event</label>
          <select id="editEventCategory">
            <option value="Others">Others</option>
            <option value="Cultural">Cultural</option>
            <option value="Technical">Technical</option>
          </select>
          <label>Registration Fee</label>
          <input type="number" id="editRegistrationFee" min="0" />
          <label>Winning Amount</label>
          <input type="number" id="editWinningAmount" min="0" />
          <label>Student Coordinator Name</label>
          <input type="text" id="editStudentCoordinatorName" />
          <label>Student Coordinator Contact (10 digits if filled)</label>
          <input
            type="text"
            id="editStudentCoordinatorContact"
            maxlength="10"
            pattern="[0-9]*"
            inputmode="numeric"
          />
          <label>Faculty Coordinator Name</label>
          <input type="text" id="editFacultyCoordinatorName" />
          <button type="submit">Save changes</button>
        </form>
      </div>
    </div>

    <div id="completionModal" class="modal">
      <div class="modal-content modal-content--form">
        <span class="modal-close" id="completionModalClose">&times;</span>
        <h3 class="modal-title" id="completionModalTitle">Complete Event</h3>
        <form id="completionForm">
          <input type="hidden" id="completionEventId" />
          <label for="completionNote">Note for students</label>
          <textarea
            id="completionNote"
            rows="5"
            placeholder="Add winners, highlights, or result details"
          ></textarea>
          <button type="submit" id="completionSubmitBtn">Save</button>
        </form>
      </div>
    </div>

    <script src="pwa.js"></script>
    <script src="club_dashboard.js"></script>
  </body>
</html>
