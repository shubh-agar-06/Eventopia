<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>College Dashboard</title>
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="clg_dashboard.css" />
  </head>

  <body>
    <h2>College Dashboard</h2>

    <!-- TOP SECTION (FORMS ONLY) -->
    <div class="container">
      <!-- Add Club -->
      <div class="card">
        <h3>Add Club</h3>
        <form id="clubForm">
          <input type="text" id="clubName" placeholder="Club Name" required />
          <input
            type="email"
            id="clubEmail"
            placeholder="Club Email"
            required
          />
          <input
            type="password"
            id="clubPassword"
            placeholder="Club Password"
            required
          />
          <div class="button-row">
            <button type="submit">Add Club</button>
            <button type="button" id="importClubBtn">Import from Excel</button>
          </div>
        </form>
        <p id="clubMsg"></p>
        <input
          type="file"
          id="clubFileInput"
          accept=".xlsx,.xls"
          style="display: none"
        />
      </div>

      <!-- Add Student -->
      <div class="card">
        <h3>Add Student</h3>
        <form id="studentForm">
          <input
            type="text"
            id="regNo"
            placeholder="Registration Number"
            required
          />
          <input
            type="text"
            id="studentName"
            placeholder="Student Name"
            required
          />
          <input
            type="email"
            id="studentEmail"
            placeholder="Student Email"
            required
          />
          <input
            type="number"
            id="yearOfGrad"
            placeholder="Year of Graduation (e.g. 2027)"
            required
          />
          <input
            type="password"
            id="studentPassword"
            placeholder="Password"
            required
          />
          <div class="button-row">
            <button type="submit">Add Student</button>
            <button type="button" id="importStudentBtn">
              Import from Excel
            </button>
          </div>
        </form>
        <p id="studentMsg"></p>
        <input
          type="file"
          id="studentFileInput"
          accept=".xlsx,.xls"
          style="display: none"
        />
      </div>
    </div>
    <br />

    <!-- Format modal (shown before import) -->
    <div id="formatModal" class="modal">
      <div class="modal-content">
        <span class="modal-close">&times;</span>
        <h3 id="formatModalTitle">Expected Excel Format</h3>
        <div id="formatModalBody"></div>
        <button type="button" id="formatModalConfirm">
          Download format & choose file
        </button>
      </div>
    </div>

    <!-- CLUB TABLE -->
    <div class="table-section">
      <div class="section-header">
        <h3>CLUBS</h3>
        <input
          type="text"
          id="clubSearch"
          class="search-bar"
          placeholder="Search by Club Name or Email"
        />
      </div>
      <table id="clubTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Club Name</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <button type="button" id="clubSeeMore" class="see-more">See more</button>
    </div>

    <!-- STUDENT TABLE -->
    <div class="table-section">
      <div class="section-header">
        <h3>STUDENTS</h3>
        <input
          type="text"
          id="studentSearch"
          class="search-bar"
          placeholder="Search by Name or Reg No."
        />
      </div>
      <table id="studentTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Registration No</th>
            <th>Name</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <button type="button" id="studentSeeMore" class="see-more">
        See more
      </button>
    </div>

    <script src="pwa.js"></script>
    <script src="clg_dashboard.js"></script>
  </body>
</html>
