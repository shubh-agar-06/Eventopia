<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventopia Login</title>
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="login-container">
      <h2>EVENTOPIA</h2>

      <form id="loginForm">
        <select id="role" required>
          <option value="">Select Role</option>
          <option value="college">College</option>
          <option value="club">Club</option>
          <option value="student">Student</option>
        </select>

        <input
          type="text"
          id="username"
          placeholder="Clg Email / Club Name / Reg No"
          required
        />

        <input type="password" id="password" placeholder="Password" required />

        <button type="submit">Login</button>
      </form>

      <button type="button" id="openCollegeRegister" class="secondary-btn">
        Register College
      </button>

      <p id="message"></p>
    </div>

    <div id="collegeRegisterModal" class="modal">
      <div class="modal-content">
        <button type="button" class="modal-close" id="closeCollegeRegister">
          &times;
        </button>
        <h3>Register College</h3>

        <form id="collegeRegisterForm">
          <input
            type="text"
            id="collegeName"
            placeholder="College Name"
            maxlength="150"
            required
          />
          <input
            type="email"
            id="collegeEmail"
            placeholder="College Email"
            maxlength="120"
            required
          />
          <input
            type="password"
            id="collegePassword"
            placeholder="Password"
            maxlength="255"
            required
          />
          <input
            type="text"
            id="collegeAddress"
            placeholder="Address"
            maxlength="255"
          />
          <input
            type="text"
            id="collegeCity"
            placeholder="City"
            maxlength="100"
          />
          <input
            type="text"
            id="collegeState"
            placeholder="State"
            maxlength="100"
          />

          <button type="submit">Create College Account</button>
        </form>

        <p id="collegeRegisterMessage"></p>
      </div>
    </div>

    <script src="pwa.js"></script>
    <script src="login.js"></script>
  </body>
</html>
